name: Deploy WatchTower

# Gated on the CI workflow finishing successfully on `main` — see
# .github/workflows/ci.yml. A push that fails CI never reaches the
# deploy job, so a broken commit can't run `migrate --force` against
# production.
on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

concurrency:
  group: deploy-watchtower-production
  cancel-in-progress: true

permissions:
  statuses: write

jobs:
  ci-failed:
    name: Report CI failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'success'
    steps:
      - name: Mark deploy as failed on the commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'failure',
              context: 'deploy/production',
              description: 'Skipped — CI did not pass',
              target_url: context.payload.workflow_run.html_url,
            });

  deploy:
    name: Zero-Touch Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Set commit status — pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'pending',
              context: 'deploy/production',
              description: 'Deploying to production...',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Deploy to server
        id: ssh_deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 30m
          script: |
            set -e
            COMPOSE="docker compose -f /home/adewale/docker/docker-compose.watchtower.yml"
            APP_DIR=/home/adewale/apps/watchtower
            API_DIR=$APP_DIR/api-watchtower

            cd $APP_DIR
            PREVIOUS_SHA=$(git rev-parse HEAD)
            echo "==> Current commit before deploy: $PREVIOUS_SHA"

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # ── Build every image before touching any container ──
            # Nothing is swapped until all four images exist, so a
            # build failure never leaves half the stack running on a
            # commit that was never deployed.
            echo "==> Building images (old containers still serving)..."
            $COMPOSE build api-watchtower
            $COMPOSE build queue-watchtower
            $COMPOSE build scheduler-watchtower
            $COMPOSE build nextjs-watchtower

            # ── API ─────────────────────────────────────────────
            echo "==> Swapping to new API container..."
            $COMPOSE up -d --no-build --force-recreate api-watchtower

            echo "==> Fixing storage permissions for www-data..."
            docker exec api-watchtower chown -R www-data:www-data /var/www/html/storage
            docker exec api-watchtower chmod -R 775 /var/www/html/storage

            # Order matters here. The container bind-mounts the checkout, so
            # the image's vendor/ is invisible at runtime and vendor/ has to
            # exist on the host before any artisan command will run —
            # `clear-compiled` dies with "failed to open vendor/autoload.php"
            # on a fresh checkout. Install without scripts first, then clear
            # the stale manifest, then regenerate the autoloader and the
            # package manifest.
            echo "==> Installing composer dependencies against the live bind mount..."
            docker exec api-watchtower composer install --no-dev --optimize-autoloader --no-scripts
            docker exec api-watchtower php artisan clear-compiled
            docker exec api-watchtower composer dump-autoload --no-dev --optimize
            docker exec api-watchtower php artisan package:discover
            docker exec api-watchtower chown -R www-data:www-data /var/www/html/vendor /var/www/html/bootstrap/cache

            echo "==> Running migrations..."
            docker exec api-watchtower php artisan migrate --force

            echo "==> Caching config, routes, views, events..."
            docker exec api-watchtower php artisan config:cache
            docker exec api-watchtower php artisan route:cache
            docker exec api-watchtower php artisan view:cache
            docker exec api-watchtower php artisan event:cache

            # api-watchtower only runs php-fpm (fastcgi on :9000) — no HTTP
            # server inside the container to curl directly. Hit the public
            # URL real traffic uses instead.
            echo "==> Waiting for API health check (/up)..."
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -sf -o /dev/null https://api-watchtower.uselodger.com/up; then
                HEALTHY=true
                break
              fi
              echo "    not healthy yet, retrying in 2s ($i/15)..."
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "==> API HEALTH CHECK FAILED — rolling back to $PREVIOUS_SHA"
              git reset --hard "$PREVIOUS_SHA"
              $COMPOSE build api-watchtower
              $COMPOSE up -d --no-build --force-recreate api-watchtower
              docker exec api-watchtower chown -R www-data:www-data /var/www/html/storage
              docker exec api-watchtower chmod -R 775 /var/www/html/storage
              docker exec api-watchtower composer install --no-dev --optimize-autoloader --no-scripts
              docker exec api-watchtower php artisan clear-compiled
              docker exec api-watchtower composer dump-autoload --no-dev --optimize
              docker exec api-watchtower php artisan package:discover
              docker exec api-watchtower chown -R www-data:www-data /var/www/html/vendor /var/www/html/bootstrap/cache
              docker exec api-watchtower php artisan migrate --force
              docker exec api-watchtower php artisan config:cache
              docker exec api-watchtower php artisan route:cache
              docker exec api-watchtower php artisan view:cache
              docker exec api-watchtower php artisan event:cache
              echo "==> Rolled back. Failing this deploy."
              exit 1
            fi

            echo "==> API health check passed."

            # ── Queue + scheduler ───────────────────────────────
            # The scheduler is what actually fires reminders — it has to
            # be running or WatchTower silently sends nothing.
            echo "==> Restarting queue worker..."
            $COMPOSE up -d --no-build --force-recreate queue-watchtower

            echo "==> Restarting scheduler..."
            $COMPOSE up -d --no-build --force-recreate scheduler-watchtower

            # ── Frontend ────────────────────────────────────────
            echo "==> Swapping to new Next.js container..."
            $COMPOSE up -d --no-build --force-recreate nextjs-watchtower

            echo "==> Waiting for frontend health check (/api/health)..."
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -sf -o /dev/null https://watchtower.uselodger.com/api/health; then
                HEALTHY=true
                break
              fi
              echo "    not healthy yet, retrying in 2s ($i/15)..."
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "==> FRONTEND HEALTH CHECK FAILED — rolling back to $PREVIOUS_SHA"
              git reset --hard "$PREVIOUS_SHA"
              $COMPOSE build api-watchtower
              $COMPOSE build nextjs-watchtower
              $COMPOSE up -d --no-build --force-recreate api-watchtower
              $COMPOSE up -d --no-build --force-recreate nextjs-watchtower
              $COMPOSE up -d --no-build --force-recreate queue-watchtower
              $COMPOSE up -d --no-build --force-recreate scheduler-watchtower
              echo "==> Rolled back. Failing this deploy."
              exit 1
            fi

            echo "==> Frontend health check passed."

            echo "==> Verifying containers are running..."
            $COMPOSE ps

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> WatchTower deployed successfully."

      - name: Set commit status — result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.ssh_deploy.outcome }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: outcome === 'success' ? 'success' : 'failure',
              context: 'deploy/production',
              description: outcome === 'success'
                ? 'Deployed to production'
                : 'Deploy failed — check the Actions log',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
