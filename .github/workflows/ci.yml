name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: API — Pint, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-watchtower

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, mysql, sqlite3, pdo_sqlite, zip, bcmath, sodium
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Pint (dry run)
        run: vendor/bin/pint --test

      - name: Test
        run: php artisan test

  frontend:
    name: Web — lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-watchtower
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-watchtower/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` runs TypeScript's own checking internally — a
      # standalone `tsc --noEmit` ahead of it fails on a fresh checkout:
      # it needs the ambient route types (LayoutProps, PageProps, etc.)
      # that only exist in .next/types/, which only gets generated by a
      # build. Locally this never surfaced because a stale .next/ from a
      # previous build was already sitting there.
      - name: Build (includes typecheck)
        run: npm run build
