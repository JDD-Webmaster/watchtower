# ── WatchTower — full stack ──────────────────────────────────────────────
# One repo, two apps:
#
#   api-watchtower/   Laravel API + the reminder engine
#   web-watchtower/   Next.js frontend
#
# Everything builds from this repo — no sibling clone needed any more.
#
#   docker compose up --build
#   docker compose exec api php artisan migrate --force   # first boot only
#
#   Web: http://localhost:3000
#   API: http://localhost:8000
#
# The `scheduler` container is what actually fires reminders (hourly,
# honoring each organization's own timezone). Without it running,
# nothing is ever sent.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: watchtower
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-watchtower}
      MYSQL_USER: watchtower
      MYSQL_PASSWORD: ${DB_PASSWORD:-watchtower}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # PHP-FPM only, no HTTP server of its own — nginx below terminates
  # HTTP and fastcgi_pass's to this on :9000, same split as production.
  api:
    build: ./api-watchtower
    restart: unless-stopped
    env_file: ./api-watchtower/.env
    environment:
      DB_HOST: mysql
      DB_DATABASE: watchtower
      DB_USERNAME: watchtower
      DB_PASSWORD: ${DB_PASSWORD:-watchtower}
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./api-watchtower/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api-watchtower/public:/var/www/html/public:ro
    ports:
      - "8000:80"
    depends_on:
      - api

  # Processes the queued SMS/email jobs ReminderDispatchService dispatches.
  queue:
    build: ./api-watchtower
    restart: unless-stopped
    env_file: ./api-watchtower/.env
    environment:
      DB_HOST: mysql
      DB_DATABASE: watchtower
      DB_USERNAME: watchtower
      DB_PASSWORD: ${DB_PASSWORD:-watchtower}
      REDIS_HOST: redis
    command: php artisan queue:work --tries=3
    depends_on:
      - api

  # Runs the Laravel scheduler loop, which is what actually fires
  # reminders:dispatch hourly (routes/console.php) — without this
  # container, nothing in WatchTower sends anything, ever.
  scheduler:
    build: ./api-watchtower
    restart: unless-stopped
    env_file: ./api-watchtower/.env
    environment:
      DB_HOST: mysql
      DB_DATABASE: watchtower
      DB_USERNAME: watchtower
      DB_PASSWORD: ${DB_PASSWORD:-watchtower}
      REDIS_HOST: redis
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction & sleep 60; done"
    depends_on:
      - api

  web:
    build:
      context: ./web-watchtower
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mysql_data:
