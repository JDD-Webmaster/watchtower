name: Deploy WatchTower Frontend

# Gated on the CI workflow finishing successfully on `main` — see
# .github/workflows/ci.yml.
on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

permissions:
  statuses: write

jobs:
  ci-failed:
    name: Report CI failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'success'
    steps:
      - name: Mark deploy as failed on the commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'failure',
              context: 'deploy/production',
              description: 'Skipped — CI did not pass',
              target_url: context.payload.workflow_run.html_url,
            });

  deploy:
    name: Zero-Touch Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Set commit status — pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'pending',
              context: 'deploy/production',
              description: 'Deploying to production...',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Deploy to server
        id: ssh_deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 30m
          script: |
            set -e
            COMPOSE="docker compose -f /home/adewale/docker/docker-compose.watchtower.yml"

            cd /home/adewale/apps/watchtower-nextjs
            PREVIOUS_SHA=$(git rev-parse HEAD)
            echo "==> Current commit before deploy: $PREVIOUS_SHA"

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building new Next.js image (old container still serving)..."
            $COMPOSE build nextjs-watchtower

            echo "==> Swapping to new Next.js container..."
            $COMPOSE up -d --no-build --force-recreate nextjs-watchtower

            echo "==> Waiting for frontend health check (/api/health)..."
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -sf -o /dev/null https://watchtower.uselodger.com/api/health; then
                HEALTHY=true
                break
              fi
              echo "    not healthy yet, retrying in 2s ($i/15)..."
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "==> HEALTH CHECK FAILED — rolling back to $PREVIOUS_SHA"
              git reset --hard "$PREVIOUS_SHA"
              $COMPOSE build nextjs-watchtower
              $COMPOSE up -d --no-build --force-recreate nextjs-watchtower
              echo "==> Rolled back. Failing this deploy."
              exit 1
            fi

            echo "==> Health check passed — new frontend container is live."
            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> WatchTower frontend deployed successfully."

      - name: Set commit status — result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.ssh_deploy.outcome }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: outcome === 'success' ? 'success' : 'failure',
              context: 'deploy/production',
              description: outcome === 'success'
                ? 'Deployed to production'
                : 'Deploy failed — check the Actions log',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
