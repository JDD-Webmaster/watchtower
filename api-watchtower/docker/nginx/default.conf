# Minimal single-site reverse proxy to PHP-FPM, for self-hosting via
# the docker-compose.yml in the watchtower (frontend) repo. Production
# uses a more elaborate shared-host nginx config instead of this one.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    client_max_body_size 20M;

    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
