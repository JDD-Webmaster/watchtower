; Stock pool config caps at pm.max_children=5, which is a real
; concurrency ceiling under any real traffic. Sized modestly here —
; WatchTower is a new, low-traffic project; raise these the same way
; UseLodger's own docker/php-fpm/pool.conf documents if real load ever
; warrants it, rather than guessing a bigger number up front.
[www]
user = www-data
group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
